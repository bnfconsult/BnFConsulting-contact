<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BnF — Portail</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', -apple-system, sans-serif;
            overflow: hidden;
        }

        /* ---- TITRE ---- */
        .portal-title {
            color: #fff;
            font-size: clamp(1.8rem, 4vw, 3.2rem);
            font-weight: 300;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-bottom: clamp(30px, 5vh, 60px);
            opacity: 0;
            animation: fadeIn 1.2s ease forwards;
        }

        /* ---- GRILLE 2x2 ---- */
        .portal-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: clamp(16px, 3vw, 40px);
            padding: 0 20px;
        }

        /* ---- FLIP CARD ---- */
        .portal-flip {
            width: clamp(180px, 22vw, 300px);
            height: clamp(180px, 22vw, 300px);
            perspective: 1000px;
            cursor: pointer;
            opacity: 0;
            transform: scale(0.3);
        }

        /* Entrée fade + scale */
        .portal-flip:nth-child(1) { animation: fadeScale 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.2s forwards, floatSoft 8s ease-in-out 1.2s infinite; }
        .portal-flip:nth-child(2) { animation: fadeScale 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.7s forwards, floatSoft 8s ease-in-out 1.7s infinite; }
        .portal-flip:nth-child(3) { animation: fadeScale 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.2s forwards, floatSoft 8s ease-in-out 2.2s infinite; }
        .portal-flip:nth-child(4) { animation: fadeScale 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.7s forwards, floatSoft 8s ease-in-out 2.7s infinite; }

        @keyframes fadeScale {
            0% { opacity: 0; transform: scale(0.3); }
            60% { opacity: 1; transform: scale(1.04); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes floatSoft {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .portal-flip-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .portal-flip.flipped .portal-flip-inner {
            transform: rotateY(180deg);
        }

        /* Face avant (image) */
        .portal-flip-front,
        .portal-flip-back {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            overflow: hidden;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
        }

        .portal-flip-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Face avant icône SVG (bulle coordonnées) */
        .portal-card-icon {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a1a1c 0%, #0f2b2e 50%, #0a1a1c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .portal-card-icon svg {
            width: 45%;
            height: 45%;
        }

        /* Face arrière (mot) — 100% opaque */
        .portal-flip-back {
            transform: rotateY(180deg);
            background: #0b1e20;
            border: 1px solid rgba(84, 155, 162, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .portal-flip-back span {
            color: #fff;
            font-size: clamp(0.9rem, 2vw, 1.4rem);
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.4;
        }

        /* Hover sur les deux faces */
        .portal-flip:hover .portal-flip-front,
        .portal-flip:hover .portal-flip-back {
            box-shadow: 0 12px 50px rgba(84, 155, 162, 0.2),
                        0 0 30px rgba(84, 155, 162, 0.08);
        }

        /* Labels sur la face avant */
        .card-label {
            position: absolute;
            z-index: 2;
            color: #1a3a4a;
            font-size: clamp(0.55rem, 1.2vw, 0.75rem);
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            pointer-events: none;
            text-shadow: 0 0 8px rgba(0,0,0,0.3);
        }
        .card-label-top { top: 10px; left: 12px; }
        .card-label-bottom { bottom: 10px; left: 12px; }
        .card-label-bottom-right { bottom: 10px; right: 12px; left: auto; }
        .card-label-white { color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,0.6); }

        @media (max-width: 480px) {
            .card-label { font-size: 0.5rem; letter-spacing: 0.1em; }
            .card-label-top { top: 7px; left: 8px; }
            .card-label-bottom { bottom: 7px; left: 8px; }
            .card-label-bottom-right { bottom: 7px; right: 8px; left: auto; }
        }

        /* Petite icône drone */
        .card-drone-icon {
            position: absolute;
            top: 10px;
            right: 12px;
            z-index: 2;
            width: clamp(22px, 3vw, 36px);
            height: clamp(22px, 3vw, 36px);
            pointer-events: none;
        }

        /* ---- CREDIT ---- */
        .portal-credit {
            color: rgba(255, 255, 255, 0.3);
            font-size: clamp(0.65rem, 1.2vw, 0.85rem);
            font-weight: 300;
            letter-spacing: 0.15em;
            margin-top: clamp(30px, 5vh, 60px);
            opacity: 0;
            animation: fadeIn 1.5s ease 2.2s forwards;
        }

        .portal-copyright {
            color: rgba(255, 255, 255, 0.15);
            font-size: clamp(0.5rem, 0.9vw, 0.65rem);
            font-weight: 300;
            letter-spacing: 0.08em;
            margin-top: 8px;
            opacity: 0;
            animation: fadeIn 1.5s ease 2.5s forwards;
        }

        /* ---- RESPONSIVE MOBILE ---- */
        @media (max-width: 768px) {
            body {
                overflow-y: auto;
                padding: 40px 0;
            }

            .portal-title {
                font-size: 1.4rem;
                letter-spacing: 0.2em;
                margin-bottom: 24px;
            }

            .portal-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
                padding: 0 24px;
            }

            .portal-flip {
                width: 38vw;
                height: 38vw;
            }

            .portal-flip-front,
            .portal-flip-back {
                border-radius: 14px;
            }
        }

        @media (max-width: 480px) {
            .portal-title {
                font-size: 1.2rem;
                margin-bottom: 20px;
            }

            .portal-container {
                gap: 12px;
                padding: 0 20px;
            }

            .portal-flip {
                width: 40vw;
                height: 40vw;
            }

            .portal-flip-front,
            .portal-flip-back {
                border-radius: 12px;
            }

            .portal-flip-back span {
                font-size: 0.65rem;
                letter-spacing: 0.12em;
            }

            .card-drone-icon { top: 7px; right: 8px; width: 18px; height: 18px; }

            .portal-credit {
                font-size: 0.6rem;
                margin-top: 24px;
            }
        }
    </style>
</head>
<body>

    <h1 class="portal-title">Bienvenue</h1>

    <div class="portal-container">

        <!-- Bulle 1 : BnF Consulting -->
        <div class="portal-flip" data-href="home.html">
            <div class="portal-flip-inner">
                <div class="portal-flip-front">
                    <span class="card-label card-label-top">Stratégie</span>
                    <img src="PHOTOS/BnFConsulting logo .jpg" alt="BnF Consulting">
                </div>
                <div class="portal-flip-back">
                    <span>Stratégie</span>
                </div>
            </div>
        </div>

        <!-- Bulle 2 : BnF Drones -->
        <div class="portal-flip" data-href="drones.html">
            <div class="portal-flip-inner">
                <div class="portal-flip-front">
                    <svg class="card-drone-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <line x1="12" y1="20" x2="52" y2="20" stroke="#1a3a4a" stroke-width="2.5" stroke-linecap="round"/>
                        <circle cx="12" cy="20" r="8" stroke="#1a3a4a" stroke-width="2" fill="none"/>
                        <circle cx="52" cy="20" r="8" stroke="#1a3a4a" stroke-width="2" fill="none"/>
                        <line x1="32" y1="20" x2="32" y2="34" stroke="#1a3a4a" stroke-width="2.5" stroke-linecap="round"/>
                        <rect x="24" y="34" width="16" height="10" rx="4" stroke="#1a3a4a" stroke-width="2" fill="none"/>
                        <circle cx="32" cy="39" r="2.5" fill="#1a3a4a" opacity="0.6"/>
                        <line x1="24" y1="44" x2="18" y2="52" stroke="#1a3a4a" stroke-width="1.5" stroke-linecap="round"/>
                        <line x1="40" y1="44" x2="46" y2="52" stroke="#1a3a4a" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <img src="PHOTOS/BnFDrones logo.jpg" alt="BnF Drones">
                </div>
                <div class="portal-flip-back">
                    <span>Drones</span>
                </div>
            </div>
        </div>

        <!-- Bulle 3 : Flow Hub -->
        <div class="portal-flip" data-href="https://www.flow-hub.fr/" data-external="true">
            <div class="portal-flip-inner">
                <div class="portal-flip-front">
                    <span class="card-label card-label-bottom card-label-white">Audit Digital</span>
                    <img src="PHOTOS/2.png" alt="Flow Hub">
                </div>
                <div class="portal-flip-back">
                    <span>Audit<br>Digital</span>
                </div>
            </div>
        </div>

        <!-- Bulle 4 : Coordonnées / Linktree -->
        <div class="portal-flip" data-href="https://linktr.ee/benjaminf_" data-external="true">
            <div class="portal-flip-inner">
                <div class="portal-flip-front">
                    <span class="card-label card-label-bottom-right card-label-white">Coordonnées</span>
                    <div class="portal-card-icon">
                        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="50" cy="30" r="12" stroke="#549BA2" stroke-width="2.5" fill="none"/>
                            <path d="M28 72c0-12.15 9.85-22 22-22s22 9.85 22 22" stroke="#549BA2" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                            <rect x="10" y="78" width="18" height="13" rx="2" stroke="#549BA2" stroke-width="1.8" fill="none" opacity="0.7"/>
                            <path d="M10 80l9 5 9-5" stroke="#549BA2" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
                            <rect x="41" y="78" width="18" height="13" rx="3" stroke="#549BA2" stroke-width="1.8" fill="none" opacity="0.7"/>
                            <line x1="47" y1="87" x2="53" y2="87" stroke="#549BA2" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
                            <circle cx="81" cy="84.5" r="6.5" stroke="#549BA2" stroke-width="1.8" fill="none" opacity="0.7"/>
                            <ellipse cx="81" cy="84.5" rx="3" ry="6.5" stroke="#549BA2" stroke-width="1.2" fill="none" opacity="0.7"/>
                            <line x1="74.5" y1="84.5" x2="87.5" y2="84.5" stroke="#549BA2" stroke-width="1.2" opacity="0.7"/>
                        </svg>
                    </div>
                </div>
                <div class="portal-flip-back">
                    <span>Coordonnées</span>
                </div>
            </div>
        </div>

    </div>

    <p class="portal-credit">By BnF</p>
    <p class="portal-copyright">All rights reserved. BnFConsulting&bull;2026</p>

    <script>
    (function() {
        var cards = document.querySelectorAll('.portal-flip');

        cards.forEach(function(card) {
            card.addEventListener('click', function(e) {
                e.preventDefault();

                // Si déjà en cours de flip, ignorer
                if (card.classList.contains('flipped')) return;

                // Retourner la bulle
                card.classList.add('flipped');

                // Après 1 seconde → ouvrir le lien
                setTimeout(function() {
                    var href = card.getAttribute('data-href');
                    var external = card.getAttribute('data-external');
                    if (external) {
                        window.open(href, '_blank', 'noopener');
                    } else {
                        window.location.href = href;
                    }
                }, 1000);
            });
        });

        // Tilt 3D au hover (desktop uniquement)
        if (!('ontouchstart' in window)) {
            cards.forEach(function(card) {
                var inner = card.querySelector('.portal-flip-inner');

                card.addEventListener('mousemove', function(e) {
                    if (card.classList.contains('flipped')) return;
                    var rect = card.getBoundingClientRect();
                    var x = e.clientX - rect.left;
                    var y = e.clientY - rect.top;
                    var rotateX = ((y - rect.height / 2) / (rect.height / 2)) * -6;
                    var rotateY = ((x - rect.width / 2) / (rect.width / 2)) * 6;
                    inner.style.transform = 'perspective(800px) rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg)';
                    inner.style.transition = 'transform 0.1s ease';
                });

                card.addEventListener('mouseleave', function() {
                    if (card.classList.contains('flipped')) return;
                    inner.style.transform = '';
                    inner.style.transition = 'transform 0.5s ease';
                });
            });
        }
    })();
    </script>

</body>
</html>
