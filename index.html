<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BnF — Portail</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', -apple-system, sans-serif;
            overflow: hidden;
        }

        /* ---- TITRE ---- */
        .portal-title {
            color: #fff;
            font-weight: 300;
            letter-spacing: 0.25em;
            margin-bottom: clamp(20px, 4vh, 40px);
            text-align: center;
            opacity: 0;
        }
        .portal-title-main {
            display: block;
            font-size: clamp(1.8rem, 4vw, 3.2rem);
            text-transform: uppercase;
        }
        .portal-title-sub {
            display: block;
            font-size: clamp(0.85rem, 1.8vw, 1.2rem);
            letter-spacing: 0.15em;
            margin-top: 8px;
            font-weight: 300;
            opacity: 0.7;
        }

        /* ---- INTRO PLEIN ÉCRAN ---- */
        .intro-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000;
            z-index: 8000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease;
        }
        .intro-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        .intro-word {
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            font-size: clamp(2rem, 9vw, 8rem);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            position: absolute;
            opacity: 0;
        }
        .intro-word.visible {
            opacity: 1;
        }
        .intro-word.fade-out {
            opacity: 0;
        }

        /* ---- GRILLE ---- */
        .portal-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(16px, 3vw, 40px);
            padding: 0 20px;
            justify-items: center;
        }

        /* ---- FLIP CARD ---- */
        .portal-flip {
            width: clamp(180px, 22vw, 300px);
            height: clamp(180px, 22vw, 300px);
            perspective: 1000px;
            cursor: pointer;
            opacity: 0;
            transform: scale(0.3);
        }

        /* Entrée fade + scale */
        .portal-flip:nth-child(1) { animation: fadeScale 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) 5.5s forwards, floatSoft 8s ease-in-out 6.5s infinite; }
        .portal-flip:nth-child(2) { animation: fadeScale 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) 5.8s forwards, floatSoft 8s ease-in-out 6.8s infinite; }
        .portal-flip:nth-child(3) { animation: fadeScale 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) 6.1s forwards, floatSoft 8s ease-in-out 7.1s infinite; }
        .portal-flip:nth-child(4) { animation: fadeScale 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) 6.4s forwards, floatSoft 8s ease-in-out 7.4s infinite; }
        .portal-flip:nth-child(5) { animation: fadeScale 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) 6.7s forwards, floatSoft 8s ease-in-out 7.7s infinite; }

        /* Centrer les 2 dernières bulles de la 2e rangée */
        .portal-flip:nth-child(4) { grid-column: 1 / 2; justify-self: end; }
        .portal-flip:nth-child(5) { grid-column: 2 / 3; justify-self: start; }

        @keyframes fadeScale {
            0% { opacity: 0; transform: scale(0.3); }
            60% { opacity: 1; transform: scale(1.04); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes floatSoft {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .portal-flip-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        /* Face avant (image) */
        .portal-flip-front {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
        }

        .portal-flip-back {
            display: none;
        }

        .portal-flip-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Face avant icône SVG (bulle coordonnées) */
        .portal-card-icon {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a1a1c 0%, #0f2b2e 50%, #0a1a1c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .portal-card-icon svg {
            width: 45%;
            height: 45%;
        }

        /* Hover glow */
        .portal-flip:hover .portal-flip-front {
            box-shadow: 0 12px 50px rgba(84, 155, 162, 0.2),
                        0 0 30px rgba(84, 155, 162, 0.08);
        }

        /* ---- ZOOM IMMERSIF ---- */
        .zoom-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 9999;
            pointer-events: none;
            overflow: hidden;
        }
        .zoom-overlay.active { pointer-events: all; }

        .zoom-card {
            position: absolute;
            overflow: hidden;
            will-change: width, height, top, left, border-radius;
        }
        .zoom-card img,
        .zoom-card .portal-card-icon {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }
        .zoom-card .portal-card-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a1a1c 0%, #0f2b2e 50%, #0a1a1c 100%);
        }
        .zoom-card .portal-card-icon svg {
            width: 45%; height: 45%;
        }

        /* Glow pendant le zoom */
        .zoom-card::after {
            content: '';
            position: absolute;
            top: -40%; left: -40%;
            width: 180%; height: 180%;
            background: radial-gradient(ellipse at center, rgba(84,155,162,0.3) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
            z-index: 1;
        }
        .zoom-card.glow-active::after { opacity: 1; }

        /* Flash blanc cinématique */
        .zoom-flash {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #fff;
            opacity: 0;
            z-index: 10000;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .zoom-flash.active { opacity: 1; }

        /* Estompage des éléments pendant le zoom */
        body.zoom-active .portal-title,
        body.zoom-active .portal-credit,
        body.zoom-active .portal-copyright {
            transition: opacity 0.4s ease, filter 0.4s ease;
            opacity: 0 !important;
            filter: blur(8px);
        }
        body.zoom-active .portal-flip {
            transition: opacity 0.4s ease, filter 0.4s ease, transform 0.4s ease;
            opacity: 0 !important;
            filter: blur(12px);
            transform: scale(0.92) !important;
        }
        body.zoom-active .portal-flip.zoom-source {
            opacity: 0 !important;
            transition: opacity 0.1s ease !important;
        }

        /* Labels sur la face avant */
        .card-label {
            position: absolute;
            z-index: 2;
            color: #1a3a4a;
            font-size: clamp(0.55rem, 1.2vw, 0.75rem);
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            pointer-events: none;
            text-shadow: 0 0 8px rgba(0,0,0,0.3);
        }
        .card-label-top { top: 10px; left: 12px; }
        .card-label-bottom { bottom: 10px; left: 12px; }
        .card-label-bottom-right { bottom: 10px; right: 12px; left: auto; }
        .card-label-top-right { top: 10px; right: 12px; left: auto; }
        .card-label-top-center { top: 10px; left: 50%; transform: translateX(-50%); white-space: nowrap; text-align: center; }
        .card-label-bottom-center { bottom: 10px; left: 50%; transform: translateX(-50%); white-space: nowrap; text-align: center; }
        .card-label-white { color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,0.6); }

        @media (max-width: 480px) {
            .card-label { font-size: 0.5rem; letter-spacing: 0.1em; }
            .card-label-top { top: 7px; left: 8px; }
            .card-label-bottom { bottom: 7px; left: 8px; }
            .card-label-bottom-right { bottom: 7px; right: 8px; left: auto; }
            .card-label-top-right { top: 7px; right: 8px; left: auto; }
            .card-label-top-center { top: 7px; left: 50%; transform: translateX(-50%); }
            .card-label-bottom-center { bottom: 7px; left: 50%; transform: translateX(-50%); }
        }

        /* Petite icône drone */
        .card-drone-icon {
            position: absolute;
            top: 10px;
            right: 12px;
            z-index: 2;
            width: clamp(22px, 3vw, 36px);
            height: clamp(22px, 3vw, 36px);
            pointer-events: none;
        }

        /* ---- CREDIT ---- */
        .portal-credit {
            color: rgba(255, 255, 255, 0.85);
            font-size: clamp(0.65rem, 1.2vw, 0.85rem);
            font-weight: 300;
            letter-spacing: 0.15em;
            margin-top: clamp(30px, 5vh, 60px);
            opacity: 0;
            animation: fadeIn 1.5s ease 7.2s forwards;
        }

        .portal-copyright {
            color: rgba(255, 255, 255, 0.5);
            font-size: clamp(0.5rem, 0.9vw, 0.65rem);
            font-weight: 300;
            letter-spacing: 0.08em;
            margin-top: 8px;
            opacity: 0;
            animation: fadeIn 1.5s ease 7.5s forwards;
        }

        /* ---- RESPONSIVE MOBILE ---- */
        @media (max-width: 768px) {
            body {
                overflow-y: auto;
                padding: 40px 0;
            }

            .portal-title {
                letter-spacing: 0.15em;
                margin-bottom: 16px;
            }
            .portal-title-main {
                font-size: 1.3rem;
            }
            .portal-title-sub {
                font-size: 0.65rem;
                letter-spacing: 0.1em;
                margin-top: 4px;
            }

            .intro-word {
                font-size: clamp(1.8rem, 8vw, 4rem);
                letter-spacing: 0.1em;
            }

            /* 3 colonnes en haut, 2 en bas — les 5 bulles rentrent */
            .portal-container {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
                padding: 0 12px;
            }

            .portal-flip {
                width: 28vw;
                height: 28vw;
            }

            /* Les 2 dernières bulles centrées sur la 2ème ligne */
            .portal-flip:nth-child(4) { grid-column: 1 / 2; justify-self: end; }
            .portal-flip:nth-child(5) { grid-column: 2 / 3; justify-self: start; }

            .portal-flip-front,
            .portal-flip-back {
                border-radius: 12px;
            }

            .portal-flip-back span {
                font-size: 0.6rem;
                letter-spacing: 0.1em;
            }

            .card-label {
                font-size: 0.4rem;
                letter-spacing: 0.08em;
            }
            .card-label-top { top: 6px; left: 6px; }
            .card-label-bottom { bottom: 6px; left: 6px; }
            .card-label-bottom-right { bottom: 6px; right: 6px; left: auto; }
            .card-label-top-right { top: 4px; right: 4px; left: auto; text-align: right; max-width: 70%; line-height: 1.3; }
            .card-label-top-center { top: 4px; left: 50%; transform: translateX(-50%); white-space: normal; width: 90%; line-height: 1.3; }
            .card-label-bottom-center { bottom: 6px; left: 50%; transform: translateX(-50%); }

            .card-drone-icon { top: 5px; right: 5px; width: 14px; height: 14px; }

            .portal-credit {
                font-size: 0.6rem;
                margin-top: 20px;
            }

            .portal-copyright {
                font-size: 0.4rem;
                margin-top: 6px;
            }
        }

        @media (max-width: 420px) {
            .portal-title-main {
                font-size: 1.1rem;
            }
            .portal-title-sub {
                font-size: 0.55rem;
            }
            .intro-word {
                font-size: clamp(1.5rem, 7vw, 3rem);
                letter-spacing: 0.08em;
            }

            .portal-container {
                gap: 8px;
                padding: 0 8px;
            }

            .portal-flip {
                width: 29vw;
                height: 29vw;
            }

            .portal-flip-front,
            .portal-flip-back {
                border-radius: 10px;
            }

            .portal-flip-back span {
                font-size: 0.5rem;
                letter-spacing: 0.08em;
            }

            .card-label {
                font-size: 0.32rem !important;
                letter-spacing: 0.06em !important;
            }
            .card-label-top { top: 4px !important; left: 4px !important; }
            .card-label-bottom { bottom: 4px !important; left: 4px !important; }
            .card-label-bottom-right { bottom: 4px !important; right: 4px !important; left: auto !important; }
            .card-label-top-right { top: 3px !important; right: 3px !important; left: auto !important; text-align: right !important; max-width: 70% !important; line-height: 1.3 !important; }
            .card-label-top-center { top: 3px !important; left: 50% !important; transform: translateX(-50%) !important; white-space: normal !important; width: 90% !important; line-height: 1.3 !important; }
            .card-label-bottom-center { bottom: 4px !important; left: 50% !important; transform: translateX(-50%) !important; }

            .card-drone-icon { top: 4px; right: 4px; width: 12px; height: 12px; }
        }
    </style>
</head>
<body>

    <!-- Intro plein écran -->
    <div class="intro-overlay" id="introOverlay">
        <span class="intro-word" id="introWord"></span>
    </div>

    <h1 class="portal-title" id="portalTitle">
        <span class="portal-title-main">Bienvenue</span>
        <span class="portal-title-sub">dans l'écosystème BnF</span>
    </h1>

    <div class="portal-container">

        <!-- Bulle 1 : BnF Consulting -->
        <div class="portal-flip" data-href="home.html">
            <div class="portal-flip-inner">
                <div class="portal-flip-front">
                    <span class="card-label card-label-top-center">Stratégie</span>
                    <img src="PHOTOS/BnFConsulting logo .jpg" alt="BnF Consulting">
                </div>
                <div class="portal-flip-back">
                    <span>Stratégie</span>
                </div>
            </div>
        </div>

        <!-- Bulle 2 : BnF Drones -->
        <div class="portal-flip" data-href="drones.html">
            <div class="portal-flip-inner">
                <div class="portal-flip-front">
                    <span class="card-label card-label-top-center">Prises de vues aériennes</span>
                    <img src="PHOTOS/BnFDrones logo.jpg" alt="BnF Drones">
                </div>
                <div class="portal-flip-back">
                    <span>Drones</span>
                </div>
            </div>
        </div>

        <!-- Bulle 3 : KIBART -->
        <div class="portal-flip" data-href="https://linktr.ee/kibart_" data-external="true">
            <div class="portal-flip-inner">
                <div class="portal-flip-front">
                    <span class="card-label card-label-top-center">Art & cohésion budgétaire</span>
                    <img src="PHOTOS/Logo KIBART.png" alt="KIBART">
                </div>
                <div class="portal-flip-back">
                    <span>Art &<br>Cohésion</span>
                </div>
            </div>
        </div>

        <!-- Bulle 4 : Flow Hub -->
        <div class="portal-flip" data-href="https://www.flow-hub.fr/" data-external="true">
            <div class="portal-flip-inner">
                <div class="portal-flip-front">
                    <span class="card-label card-label-bottom-center card-label-white">Optimisez votre infrastructure digitale</span>
                    <img src="PHOTOS/2.png" alt="Flow Hub">
                </div>
                <div class="portal-flip-back">
                    <span>Audit<br>Digital</span>
                </div>
            </div>
        </div>

        <!-- Bulle 5 : Coordonnées / Linktree -->
        <div class="portal-flip" data-href="https://linktr.ee/benjaminf_" data-external="true">
            <div class="portal-flip-inner">
                <div class="portal-flip-front">
                    <span class="card-label card-label-bottom-center card-label-white">Coordonnées</span>
                    <div class="portal-card-icon">
                        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="50" cy="30" r="12" stroke="#549BA2" stroke-width="2.5" fill="none"/>
                            <path d="M28 72c0-12.15 9.85-22 22-22s22 9.85 22 22" stroke="#549BA2" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                            <rect x="10" y="78" width="18" height="13" rx="2" stroke="#549BA2" stroke-width="1.8" fill="none" opacity="0.7"/>
                            <path d="M10 80l9 5 9-5" stroke="#549BA2" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
                            <rect x="41" y="78" width="18" height="13" rx="3" stroke="#549BA2" stroke-width="1.8" fill="none" opacity="0.7"/>
                            <line x1="47" y1="87" x2="53" y2="87" stroke="#549BA2" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
                            <circle cx="81" cy="84.5" r="6.5" stroke="#549BA2" stroke-width="1.8" fill="none" opacity="0.7"/>
                            <ellipse cx="81" cy="84.5" rx="3" ry="6.5" stroke="#549BA2" stroke-width="1.2" fill="none" opacity="0.7"/>
                            <line x1="74.5" y1="84.5" x2="87.5" y2="84.5" stroke="#549BA2" stroke-width="1.2" opacity="0.7"/>
                        </svg>
                    </div>
                </div>
                <div class="portal-flip-back">
                    <span>Coordonnées</span>
                </div>
            </div>
        </div>

    </div>

    <p class="portal-credit">By BnF</p>
    <p class="portal-copyright">All rights reserved. BnFConsulting&bull;2026</p>

    <div class="zoom-overlay" id="zoomOverlay"></div>
    <div class="zoom-flash" id="zoomFlash"></div>

    <script>
    (function() {
        // ---- INTRO ANIMATION ----
        var introOverlay = document.getElementById('introOverlay');
        var introWord = document.getElementById('introWord');
        var portalTitle = document.getElementById('portalTitle');
        var words = ['Bienvenue', 'dans', "l'écosystème", 'BnF'];
        var wordIndex = 0;
        var wordDelay = 300; // 300ms

        function showNextWord() {
            if (wordIndex >= words.length) {
                // Tous les mots affichés → dézoomer vers le titre final
                introWord.classList.remove('visible');
                introWord.classList.add('fade-out');
                setTimeout(function() {
                    introOverlay.classList.add('fade-out');
                    portalTitle.style.opacity = '1';
                    portalTitle.style.transition = 'opacity 0.8s ease';
                }, 300);
                return;
            }

            // Afficher le mot
            introWord.textContent = words[wordIndex];
            introWord.className = 'intro-word';

            // Petit délai pour déclencher la transition
            requestAnimationFrame(function() {
                requestAnimationFrame(function() {
                    introWord.classList.add('visible');
                });
            });

            // Après 0.75s, faire disparaître puis passer au suivant
            setTimeout(function() {
                introWord.classList.remove('visible');
                introWord.classList.add('fade-out');

                setTimeout(function() {
                    wordIndex++;
                    showNextWord();
                }, 350);
            }, wordDelay);
        }

        // Lancer l'intro après un court délai
        setTimeout(showNextWord, 400);

        var cards = document.querySelectorAll('.portal-flip');
        var isZooming = false;

        // ---- ZOOM IMMERSIF AU CLIC ----
        cards.forEach(function(card) {
            card.addEventListener('click', function(e) {
                e.preventDefault();
                if (isZooming) return;

                var href = card.getAttribute('data-href');
                if (!href) return;

                isZooming = true;

                // 1. Préparer le clone
                var frontFace = card.querySelector('.portal-flip-front');
                var rect = frontFace.getBoundingClientRect();
                var computedStyle = getComputedStyle(frontFace);
                var currentRadius = parseFloat(computedStyle.borderRadius) || 20;

                var overlay = document.getElementById('zoomOverlay');
                var zoomCard = document.createElement('div');
                zoomCard.className = 'zoom-card';
                zoomCard.innerHTML = frontFace.innerHTML;

                // Retirer les labels du clone
                var labels = zoomCard.querySelectorAll('.card-label');
                labels.forEach(function(l) { l.remove(); });

                // Positionner le clone exactement sur la bulle
                zoomCard.style.top = rect.top + 'px';
                zoomCard.style.left = rect.left + 'px';
                zoomCard.style.width = rect.width + 'px';
                zoomCard.style.height = rect.height + 'px';
                zoomCard.style.borderRadius = currentRadius + 'px';
                zoomCard.style.boxShadow = '0 8px 40px rgba(0,0,0,0.6)';

                overlay.appendChild(zoomCard);
                overlay.classList.add('active');

                // 2. Masquer la bulle originale + estomper le reste
                card.classList.add('zoom-source');
                var inner = card.querySelector('.portal-flip-inner');
                inner.style.transform = '';
                inner.style.transition = 'none';
                document.body.classList.add('zoom-active');

                // 3. Glow teal
                setTimeout(function() {
                    zoomCard.classList.add('glow-active');
                }, 50);

                // 4. Animation zoom plein écran
                var vw = window.innerWidth;
                var vh = window.innerHeight;

                var animation = zoomCard.animate([
                    {
                        top: rect.top + 'px',
                        left: rect.left + 'px',
                        width: rect.width + 'px',
                        height: rect.height + 'px',
                        borderRadius: currentRadius + 'px',
                        boxShadow: '0 8px 40px rgba(0,0,0,0.6)',
                        offset: 0
                    },
                    {
                        top: (rect.top - 15) + 'px',
                        left: (rect.left - 8) + 'px',
                        width: (rect.width + 16) + 'px',
                        height: (rect.height + 16) + 'px',
                        borderRadius: (currentRadius * 0.8) + 'px',
                        boxShadow: '0 20px 80px rgba(84,155,162,0.3), 0 0 60px rgba(84,155,162,0.15)',
                        offset: 0.25
                    },
                    {
                        top: '0px',
                        left: '0px',
                        width: vw + 'px',
                        height: vh + 'px',
                        borderRadius: '0px',
                        boxShadow: '0 0 0 rgba(0,0,0,0)',
                        offset: 1
                    }
                ], {
                    duration: 800,
                    delay: 150,
                    easing: 'cubic-bezier(0.16, 1, 0.3, 1)',
                    fill: 'forwards'
                });

                // 5. Flash blanc + navigation
                animation.onfinish = function() {
                    var flash = document.getElementById('zoomFlash');
                    flash.classList.add('active');

                    setTimeout(function() {
                        window.location.href = href;

                        // Cleanup pour bouton retour
                        setTimeout(function() {
                            flash.classList.remove('active');
                            overlay.classList.remove('active');
                            zoomCard.remove();
                            card.classList.remove('zoom-source');
                            document.body.classList.remove('zoom-active');
                            isZooming = false;
                        }, 500);
                    }, 250);
                };
            });
        });

        // ---- TILT 3D AU HOVER (desktop) ----
        if (!('ontouchstart' in window)) {
            cards.forEach(function(card) {
                var inner = card.querySelector('.portal-flip-inner');

                card.addEventListener('mousemove', function(e) {
                    if (card.classList.contains('zoom-source')) return;
                    var rect = card.getBoundingClientRect();
                    var x = e.clientX - rect.left;
                    var y = e.clientY - rect.top;
                    var rotateX = ((y - rect.height / 2) / (rect.height / 2)) * -6;
                    var rotateY = ((x - rect.width / 2) / (rect.width / 2)) * 6;
                    inner.style.transform = 'perspective(800px) rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg)';
                    inner.style.transition = 'transform 0.1s ease';
                });

                card.addEventListener('mouseleave', function() {
                    if (card.classList.contains('zoom-source')) return;
                    inner.style.transform = '';
                    inner.style.transition = 'transform 0.5s ease';
                });
            });
        }

        // ---- CLEANUP BOUTON RETOUR ----
        window.addEventListener('pageshow', function(e) {
            if (e.persisted) {
                document.body.classList.remove('zoom-active');
                var overlay = document.getElementById('zoomOverlay');
                overlay.innerHTML = '';
                overlay.classList.remove('active');
                document.getElementById('zoomFlash').classList.remove('active');
                cards.forEach(function(c) { c.classList.remove('zoom-source'); });
                isZooming = false;
            }
        });
    })();
    </script>

</body>
</html>
