<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BnF — Portail</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', -apple-system, sans-serif;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('PHOTOS/Drones/Best_teinture_vert (4).JPG') center/cover no-repeat;
            opacity: 0.12;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, transparent 20%, rgba(0,0,0,0.8) 100%);
            z-index: 0;
        }
        body > * { position: relative; z-index: 1; }

        /* ---- INTRO ---- */
        .intro-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000;
            z-index: 8000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease;
        }
        .intro-words-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3em;
        }
        .intro-sub-words {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3em;
        }
        .intro-word {
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            font-size: clamp(2rem, 9vw, 8rem);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            opacity: 0;
        }
        .intro-word.visible { opacity: 1; }

        .intro-overlay.to-final {
            background: transparent;
            transition: background 0.8s ease;
        }
        .intro-words-stack.to-final {
            gap: 4px;
            transition: transform 0.8s ease, gap 0.8s ease;
        }
        .intro-words-stack.to-final .intro-word {
            transition: font-size 0.8s ease, letter-spacing 0.8s ease, opacity 0.8s ease;
        }
        .intro-words-stack.to-final .intro-word[data-word="Bienvenue"] {
            font-size: clamp(1.8rem, 4vw, 3.2rem);
            letter-spacing: 0.25em;
        }
        .intro-sub-words.to-final {
            flex-direction: row;
            gap: 0.25em;
        }
        .intro-sub-words.to-final .intro-word {
            font-size: clamp(1.8rem, 4vw, 3.2rem);
            letter-spacing: 0.25em;
            opacity: 0.7;
        }
        .intro-overlay.intro-hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        /* ---- TITRE ---- */
        .portal-title {
            color: #fff;
            font-weight: 300;
            letter-spacing: 0.25em;
            margin-bottom: clamp(30px, 5vh, 60px);
            text-align: center;
            opacity: 0;
        }
        .portal-title-main {
            display: block;
            font-size: clamp(1.8rem, 4vw, 3.2rem);
            text-transform: uppercase;
        }
        .portal-title-sub {
            display: block;
            font-size: clamp(1.8rem, 4vw, 3.2rem);
            letter-spacing: 0.25em;
            margin-top: 8px;
            font-weight: 300;
            opacity: 0.7;
        }

        /* ---- ORBITAL ---- */
        .orbital-wrapper {
            opacity: 0;
            transform: scale(0.6);
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .orbital-wrapper.visible {
            animation: orbitalIn 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes orbitalIn {
            0% { opacity: 0; transform: scale(0.6); }
            60% { opacity: 1; transform: scale(1.03); }
            100% { opacity: 1; transform: scale(1); }
        }

        .orbital-container {
            position: relative;
            width: clamp(320px, 50vw, 520px);
            height: clamp(320px, 50vw, 520px);
        }

        /* Rings */
        .orbital-ring {
            position: absolute;
            border: 1px solid rgba(84, 155, 162, 0.12);
            border-radius: 50%;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        .orbital-ring-1 { width: 55%; height: 55%; }
        .orbital-ring-2 { width: 85%; height: 85%; border-color: rgba(84, 155, 162, 0.08); }
        .orbital-ring-3 { width: 100%; height: 100%; border-color: rgba(84, 155, 162, 0.04); }

        /* Dotted orbit path */
        .orbital-ring-dots {
            position: absolute;
            width: 70%; height: 70%;
            border: 1px dashed rgba(84, 155, 162, 0.1);
            border-radius: 50%;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation: orbitSpin 120s linear infinite;
        }

        @keyframes orbitSpin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Center */
        .orbital-center {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 3;
        }
        .orbital-center-logo {
            width: clamp(70px, 10vw, 110px);
            height: auto;
            border-radius: 8px;
            opacity: 0.9;
            margin-bottom: 10px;
        }
        .orbital-center-tagline {
            color: rgba(255, 255, 255, 0.4);
            font-size: clamp(0.5rem, 0.9vw, 0.7rem);
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        /* Satellite nodes */
        .orbital-node {
            position: absolute;
            width: clamp(90px, 12vw, 130px);
            text-align: center;
            z-index: 2;
            transition: transform 0.4s ease;
        }
        .orbital-wrapper:hover .orbital-node {
            transform: scale(1.08);
        }

        /* Positioning: 3 nodes at 120° intervals (top, bottom-right, bottom-left) */
        .orbital-node-1 {
            top: 0%; left: 50%;
            transform: translateX(-50%);
        }
        .orbital-node-2 {
            bottom: 12%; right: 2%;
            transform: translate(0, 0);
        }
        .orbital-node-3 {
            bottom: 12%; left: 2%;
            transform: translate(0, 0);
        }

        .orbital-wrapper:hover .orbital-node-1 { transform: translateX(-50%) scale(1.08); }
        .orbital-wrapper:hover .orbital-node-2 { transform: translate(0, 0) scale(1.08); }
        .orbital-wrapper:hover .orbital-node-3 { transform: translate(0, 0) scale(1.08); }

        .node-num {
            color: #549BA2;
            font-size: clamp(1.2rem, 2vw, 1.6rem);
            font-weight: 700;
            font-family: Georgia, 'Times New Roman', serif;
            line-height: 1;
            margin-bottom: 4px;
        }
        .node-label {
            color: #fff;
            font-size: clamp(0.55rem, 1vw, 0.75rem);
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .node-brand {
            color: rgba(255, 255, 255, 0.4);
            font-size: clamp(0.4rem, 0.75vw, 0.55rem);
            font-weight: 300;
            letter-spacing: 0.08em;
        }

        /* Connector dots */
        .orbital-dot {
            position: absolute;
            width: 5px; height: 5px;
            background: #549BA2;
            border-radius: 50%;
            opacity: 0.4;
            z-index: 1;
        }
        .orbital-dot-1 { top: 18%; left: 18%; }
        .orbital-dot-2 { top: 18%; right: 18%; }
        .orbital-dot-3 { bottom: 30%; left: 50%; transform: translateX(-50%); }

        /* CTA */
        .orbital-cta {
            text-align: center;
            margin-top: clamp(20px, 4vh, 40px);
            opacity: 0;
            animation: fadeIn 1.5s ease 3.8s forwards;
        }
        .orbital-cta-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: clamp(0.6rem, 1vw, 0.8rem);
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .orbital-cta-btn {
            display: inline-block;
            color: #fff;
            font-size: clamp(0.65rem, 1.1vw, 0.85rem);
            font-weight: 500;
            letter-spacing: 0.1em;
            padding: 12px 32px;
            border: 1px solid rgba(84, 155, 162, 0.35);
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.4s ease;
            backdrop-filter: blur(8px);
            background: rgba(84, 155, 162, 0.06);
        }
        .orbital-cta-btn:hover {
            border-color: rgba(84, 155, 162, 0.7);
            background: rgba(84, 155, 162, 0.12);
            box-shadow: 0 0 30px rgba(84, 155, 162, 0.15);
            transform: translateY(-2px);
        }

        /* Hover glow on whole orbital */
        .orbital-wrapper:hover .orbital-ring-1 {
            border-color: rgba(84, 155, 162, 0.25);
            box-shadow: 0 0 40px rgba(84, 155, 162, 0.06);
            transition: all 0.5s ease;
        }
        .orbital-wrapper:hover .orbital-ring-2 {
            border-color: rgba(84, 155, 162, 0.15);
            transition: all 0.5s ease;
        }
        .orbital-wrapper:hover .orbital-dot {
            opacity: 0.7;
            transition: opacity 0.4s ease;
        }

        /* Footer */
        .portal-credit {
            color: rgba(255, 255, 255, 0.85);
            font-size: clamp(0.65rem, 1.2vw, 0.85rem);
            font-weight: 300;
            letter-spacing: 0.15em;
            margin-top: clamp(25px, 4vh, 50px);
            opacity: 0;
            animation: fadeIn 1.5s ease 4.2s forwards;
        }
        .portal-copyright {
            color: rgba(255, 255, 255, 0.5);
            font-size: clamp(0.5rem, 0.9vw, 0.65rem);
            font-weight: 300;
            letter-spacing: 0.08em;
            margin-top: 8px;
            opacity: 0;
            animation: fadeIn 1.5s ease 4.5s forwards;
        }

        @keyframes fadeIn { to { opacity: 1; } }

        /* Rotating orbit container */
        .orbital-orbit {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            animation: orbitRotate 120s linear infinite;
        }

        @keyframes orbitRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Counter-rotate node content so text stays upright */
        .node-inner {
            animation: orbitRotateReverse 120s linear infinite;
        }

        @keyframes orbitRotateReverse {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        /* No floating — orbital stays fixed after entry */

        /* ---- RESPONSIVE ---- */
        @media (max-width: 768px) {
            body { overflow-y: auto; padding: 30px 0; }

            .portal-title {
                letter-spacing: 0.15em;
                margin-bottom: 20px;
            }
            .portal-title-main { font-size: 1.8rem; }
            .portal-title-sub { font-size: 1.8rem; letter-spacing: 0.15em; margin-top: 4px; }

            .intro-word { font-size: clamp(1.8rem, 8vw, 4rem); letter-spacing: 0.1em; }
            .intro-words-stack.to-final .intro-word[data-word="Bienvenue"] { font-size: 1.8rem; }
            .intro-sub-words.to-final .intro-word { font-size: 1.8rem; }

            .orbital-container {
                width: 85vw;
                height: 85vw;
            }

            .node-num { font-size: 1.3rem; }
            .node-label { font-size: 0.55rem; }
            .node-brand { font-size: 0.42rem; }

            .orbital-cta { margin-top: 15px; }
            .portal-credit { font-size: 0.6rem; margin-top: 15px; }
            .portal-copyright { font-size: 0.4rem; margin-top: 6px; }
        }

        @media (max-width: 420px) {
            .portal-title-main { font-size: 1.5rem; }
            .portal-title-sub { font-size: 1.5rem; }
            .intro-word { font-size: clamp(1.5rem, 7vw, 3rem); letter-spacing: 0.08em; }
            .intro-words-stack.to-final .intro-word[data-word="Bienvenue"] { font-size: 1.5rem; }
            .intro-sub-words.to-final .intro-word { font-size: 1.5rem; }

            .orbital-container { width: 92vw; height: 92vw; }
            .node-num { font-size: 1.1rem; }
            .node-label { font-size: 0.48rem; }
            .node-brand { font-size: 0.38rem; }
        }
    </style>
</head>
<body>

    <!-- Intro plein écran -->
    <div class="intro-overlay" id="introOverlay">
        <div class="intro-words-stack" id="introStack">
            <span class="intro-word" data-word="Bienvenue">Bienvenue</span>
            <div class="intro-sub-words" id="introSubWords">
                <span class="intro-word" data-word="dans">dans</span>
                <span class="intro-word" data-word="l'architecture">l'architecture</span>
                <span class="intro-word" data-word="BnF">BnF</span>
            </div>
        </div>
    </div>

    <h1 class="portal-title" id="portalTitle">
        <span class="portal-title-main">Bienvenue</span>
        <span class="portal-title-sub">dans l'architecture BnF</span>
    </h1>

    <!-- Orbital architecture -->
    <a href="home.html" class="orbital-wrapper" id="orbitalWrapper">
        <div class="orbital-container">

            <!-- Rings -->
            <div class="orbital-ring orbital-ring-3"></div>
            <div class="orbital-ring orbital-ring-2"></div>
            <div class="orbital-ring orbital-ring-dots"></div>
            <div class="orbital-ring orbital-ring-1"></div>

            <!-- Center (fixed) -->
            <div class="orbital-center">
                <img src="PHOTOS/Logo_paysage (2).jpg" alt="BnF" class="orbital-center-logo">
                <div class="orbital-center-tagline">Architecture</div>
            </div>

            <!-- Rotating orbit with nodes + dots -->
            <div class="orbital-orbit">
                <div class="orbital-dot orbital-dot-1"></div>
                <div class="orbital-dot orbital-dot-2"></div>
                <div class="orbital-dot orbital-dot-3"></div>

                <div class="orbital-node orbital-node-1">
                    <div class="node-inner">
                        <div class="node-num">01</div>
                        <div class="node-label">Stratégie</div>
                        <div class="node-brand">BnF Consulting</div>
                    </div>
                </div>

                <div class="orbital-node orbital-node-2">
                    <div class="node-inner">
                        <div class="node-num">02</div>
                        <div class="node-label">Optimisation</div>
                        <div class="node-brand">Flow</div>
                    </div>
                </div>

                <div class="orbital-node orbital-node-3">
                    <div class="node-inner">
                        <div class="node-num">03</div>
                        <div class="node-label">Visibilité</div>
                        <div class="node-brand">DRONE PRO MOTION</div>
                    </div>
                </div>

            </div>

        </div>
    </a>

    <div class="orbital-cta">
        <p class="orbital-cta-text">UNE ARCHITECTURE. TROIS EXPERTISES COMPLÉMENTAIRES.</p>
        <a href="home.html" class="orbital-cta-btn">Découvrir &rarr;</a>
    </div>

    <p class="portal-credit">By BnF</p>
    <p class="portal-copyright">BnFConsulting&bull;2019-2026</p>

    <script>
    (function() {
        // ---- INTRO ANIMATION ----
        var introOverlay = document.getElementById('introOverlay');
        var introStack = document.getElementById('introStack');
        var introSubWords = document.getElementById('introSubWords');
        var introWords = introStack.querySelectorAll('.intro-word');
        var portalTitle = document.getElementById('portalTitle');
        var orbitalWrapper = document.getElementById('orbitalWrapper');
        var wordDelay = 300;
        var wordIndex = 0;

        function startFinalTransition() {
            portalTitle.style.opacity = '0.001';
            portalTitle.style.visibility = 'visible';
            var titleRect = portalTitle.getBoundingClientRect();
            var titleCenterY = titleRect.top + titleRect.height / 2;
            portalTitle.style.opacity = '0';
            portalTitle.style.visibility = '';

            var stackRect = introStack.getBoundingClientRect();
            var stackCenterY = stackRect.top + stackRect.height / 2;
            var offsetY = titleCenterY - stackCenterY;

            introStack.style.transform = 'translateY(' + offsetY + 'px)';

            introOverlay.classList.add('to-final');
            introStack.classList.add('to-final');
            introSubWords.classList.add('to-final');

            setTimeout(function() {
                introOverlay.classList.add('intro-hidden');
                portalTitle.style.opacity = '1';
                // Show orbital
                orbitalWrapper.classList.add('visible');
            }, 850);
        }

        function showNextWord() {
            if (wordIndex >= introWords.length) {
                setTimeout(startFinalTransition, 400);
                return;
            }
            introWords[wordIndex].classList.add('visible');
            wordIndex++;
            setTimeout(showNextWord, wordDelay);
        }

        setTimeout(showNextWord, 400);
    })();
    </script>

</body>
</html>
