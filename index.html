<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BnF — Portail</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', -apple-system, sans-serif;
            overflow: hidden;
        }

        /* ---- TITRE ---- */
        .portal-title {
            color: #fff;
            font-size: clamp(1.8rem, 4vw, 3.2rem);
            font-weight: 300;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-bottom: clamp(30px, 5vh, 60px);
            opacity: 0;
            animation: fadeIn 1.2s ease forwards;
        }

        /* ---- GRILLE 2x2 ---- */
        .portal-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: clamp(16px, 3vw, 40px);
            padding: 0 20px;
            perspective: 800px;
        }

        .portal-card {
            position: relative;
            width: clamp(180px, 22vw, 300px);
            height: clamp(180px, 22vw, 300px);
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            text-decoration: none;
            display: block;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            transform-style: preserve-3d;
            transition: box-shadow 0.4s ease;
        }

        /* ---- ENTRÉE : Fade + Scale ---- */
        .portal-card {
            opacity: 0;
            transform: scale(0.3);
        }

        .portal-card:nth-child(1) { animation: fadeScale 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.2s forwards, floatSoft 8s ease-in-out 1.2s infinite; }
        .portal-card:nth-child(2) { animation: fadeScale 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.7s forwards, floatSoft 8s ease-in-out 1.7s infinite; }
        .portal-card:nth-child(3) { animation: fadeScale 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.2s forwards, floatSoft 8s ease-in-out 2.2s infinite; }
        .portal-card:nth-child(4) { animation: fadeScale 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.7s forwards, floatSoft 8s ease-in-out 2.7s infinite; }

        @keyframes fadeScale {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            60% {
                opacity: 1;
                transform: scale(1.04);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ---- IDLE : Flottement doux ---- */
        @keyframes floatSoft {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* ---- HOVER : base (mobile fallback) ---- */
        .portal-card:hover {
            box-shadow: 0 16px 60px rgba(84, 155, 162, 0.25),
                        0 0 40px rgba(84, 155, 162, 0.1);
        }

        .portal-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .portal-card:hover img {
            transform: scale(1.04);
        }

        /* Bulle icône SVG (coordonnées) */
        .portal-card-icon {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a1a1c 0%, #0f2b2e 50%, #0a1a1c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.6s ease;
        }

        .portal-card:hover .portal-card-icon {
            background: linear-gradient(135deg, #0d2224 0%, #133538 50%, #0d2224 100%);
        }

        .portal-card-icon svg {
            width: 45%;
            height: 45%;
            transition: transform 0.6s ease;
        }

        .portal-card:hover .portal-card-icon svg {
            transform: scale(1.06);
        }

        /* Labels sur les bulles */
        .card-label {
            position: absolute;
            z-index: 2;
            color: #1a3a4a;
            font-size: clamp(0.55rem, 1.2vw, 0.75rem);
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            pointer-events: none;
            text-shadow: 0 0 8px rgba(0,0,0,0.3);
        }

        .card-label-top {
            top: 10px;
            left: 12px;
        }

        .card-label-bottom {
            bottom: 10px;
            left: 12px;
        }

        /* Petite icône drone */
        .card-drone-icon {
            position: absolute;
            top: 10px;
            right: 12px;
            z-index: 2;
            width: clamp(22px, 3vw, 36px);
            height: clamp(22px, 3vw, 36px);
            pointer-events: none;
        }

        @media (max-width: 480px) {
            .card-label {
                font-size: 0.5rem;
                letter-spacing: 0.1em;
            }
            .card-label-top { top: 7px; left: 8px; }
            .card-label-bottom { bottom: 7px; left: 8px; }
            .card-drone-icon { top: 7px; right: 8px; width: 18px; height: 18px; }
        }

        /* Léger overlay au survol */
        .portal-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            border: 2px solid transparent;
            transition: border-color 0.4s ease;
            pointer-events: none;
        }

        .portal-card:hover::after {
            border-color: rgba(84, 155, 162, 0.4);
        }

        /* ---- CREDIT ---- */
        .portal-credit {
            color: rgba(255, 255, 255, 0.3);
            font-size: clamp(0.65rem, 1.2vw, 0.85rem);
            font-weight: 300;
            letter-spacing: 0.15em;
            margin-top: clamp(30px, 5vh, 60px);
            opacity: 0;
            animation: fadeIn 1.5s ease 2.2s forwards;
        }

        /* ---- RESPONSIVE MOBILE ---- */
        @media (max-width: 768px) {
            body {
                overflow-y: auto;
                padding: 40px 0;
            }

            .portal-title {
                font-size: 1.4rem;
                letter-spacing: 0.2em;
                margin-bottom: 24px;
            }

            .portal-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
                padding: 0 24px;
            }

            .portal-card {
                width: 38vw;
                height: 38vw;
                border-radius: 14px;
            }
        }

        @media (max-width: 480px) {
            .portal-title {
                font-size: 1.2rem;
                margin-bottom: 20px;
            }

            .portal-container {
                gap: 12px;
                padding: 0 20px;
            }

            .portal-card {
                width: 40vw;
                height: 40vw;
                border-radius: 12px;
            }

            .portal-credit {
                font-size: 0.6rem;
                margin-top: 24px;
            }
        }
    </style>
</head>
<body>

    <h1 class="portal-title">Bienvenue</h1>

    <div class="portal-container">

        <!-- Bulle 1 : BnF Consulting — STRATÉGIE en haut -->
        <a href="home.html" class="portal-card">
            <span class="card-label card-label-top">Stratégie</span>
            <img src="PHOTOS/BnFConsulting logo .jpg" alt="BnF Consulting">
        </a>

        <!-- Bulle 2 : BnF Drones — icône drone en haut à droite -->
        <a href="drones.html" class="portal-card">
            <svg class="card-drone-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <line x1="12" y1="20" x2="52" y2="20" stroke="#1a3a4a" stroke-width="2.5" stroke-linecap="round"/>
                <circle cx="12" cy="20" r="8" stroke="#1a3a4a" stroke-width="2" fill="none"/>
                <circle cx="52" cy="20" r="8" stroke="#1a3a4a" stroke-width="2" fill="none"/>
                <line x1="32" y1="20" x2="32" y2="34" stroke="#1a3a4a" stroke-width="2.5" stroke-linecap="round"/>
                <rect x="24" y="34" width="16" height="10" rx="4" stroke="#1a3a4a" stroke-width="2" fill="none"/>
                <circle cx="32" cy="39" r="2.5" fill="#1a3a4a" opacity="0.6"/>
                <line x1="24" y1="44" x2="18" y2="52" stroke="#1a3a4a" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="40" y1="44" x2="46" y2="52" stroke="#1a3a4a" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <img src="PHOTOS/BnFDrones logo.jpg" alt="BnF Drones">
        </a>

        <!-- Bulle 3 : Flow Hub — AUDIT en bas -->
        <a href="https://www.flow-hub.fr/" class="portal-card" target="_blank" rel="noopener">
            <span class="card-label card-label-bottom">Audit</span>
            <img src="PHOTOS/2.png" alt="Flow Hub">
        </a>

        <!-- Bulle 4 : Coordonnées / Linktree — COORDONNÉES en bas -->
        <a href="https://linktr.ee/benjaminf_" class="portal-card" target="_blank" rel="noopener">
            <span class="card-label card-label-bottom">Coordonnées</span>
            <div class="portal-card-icon">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="30" r="12" stroke="#549BA2" stroke-width="2.5" fill="none"/>
                    <path d="M28 72c0-12.15 9.85-22 22-22s22 9.85 22 22" stroke="#549BA2" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                    <rect x="10" y="78" width="18" height="13" rx="2" stroke="#549BA2" stroke-width="1.8" fill="none" opacity="0.7"/>
                    <path d="M10 80l9 5 9-5" stroke="#549BA2" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
                    <rect x="41" y="78" width="18" height="13" rx="3" stroke="#549BA2" stroke-width="1.8" fill="none" opacity="0.7"/>
                    <line x1="47" y1="87" x2="53" y2="87" stroke="#549BA2" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
                    <circle cx="81" cy="84.5" r="6.5" stroke="#549BA2" stroke-width="1.8" fill="none" opacity="0.7"/>
                    <ellipse cx="81" cy="84.5" rx="3" ry="6.5" stroke="#549BA2" stroke-width="1.2" fill="none" opacity="0.7"/>
                    <line x1="74.5" y1="84.5" x2="87.5" y2="84.5" stroke="#549BA2" stroke-width="1.2" opacity="0.7"/>
                </svg>
            </div>
        </a>

    </div>

    <p class="portal-credit">By BnF</p>

    <!-- Tilt 3D au hover (desktop uniquement) -->
    <script>
    (function() {
        if ('ontouchstart' in window) return; // pas de tilt sur mobile

        var cards = document.querySelectorAll('.portal-card');

        cards.forEach(function(card) {
            card.addEventListener('mousemove', function(e) {
                var rect = card.getBoundingClientRect();
                var x = e.clientX - rect.left;
                var y = e.clientY - rect.top;
                var centerX = rect.width / 2;
                var centerY = rect.height / 2;

                var rotateX = ((y - centerY) / centerY) * -8;
                var rotateY = ((x - centerX) / centerX) * 8;

                card.style.transform = 'perspective(800px) rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg) scale(1.03)';
                card.style.transition = 'transform 0.1s ease, box-shadow 0.4s ease';
            });

            card.addEventListener('mouseleave', function() {
                card.style.transform = '';
                card.style.transition = 'transform 0.5s ease, box-shadow 0.4s ease';
            });
        });
    })();
    </script>

</body>
</html>
